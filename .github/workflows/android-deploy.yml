name: THE 100TRAL - Global Release (Windows & Android)

on:
  push:
    branches: [ "master", "restauration-multiplateforme" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: \u002717\u0027
        distribution: \u0027temurin\u0027
        cache: \u0027gradle\u0027

    - name: Build Windows Executable
      run: ./gradlew :desktop:createDistributable --no-daemon

    - name: Build Android APK
      run: ./gradlew :app:assembleDebug --no-daemon

    - name: Upload Windows App
      uses: actions/upload-artifact@v4
      with:
        name: THE100TRAL-Windows
        path: desktop/build/compose/binaries/main/app/

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: THE100TRAL-Android
        path: app/build/outputs/apk/debug/app-debug.apk
