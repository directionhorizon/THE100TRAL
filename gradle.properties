# THE 100TRAL - Optimisation Finale pour déploiement Wi-Fi
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Configuration Android
android.useAndroidX=true
android.enableJetifier=true

# Désactivation de K2 pour stabilité maximale
kotlin.experimental.tryK2=false

# Cache sur D: pour sauver le disque C: (local uniquement)
systemProp.gradle.user.home=D:/gradle_cache_100tral
systemProp.android.user.home=D:/android_home
