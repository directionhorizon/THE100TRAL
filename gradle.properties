# Configuration THE 100TRAL - Optimisée pour déploiement Firebase
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Force l'utilisation du JDK stable sur D: pour éviter l'erreur 25.0.2
org.gradle.java.home=D:/android studio/jbr

# Configuration Android
android.useAndroidX=true
android.enableJetifier=true

# Désactivation de K2 pour stabilité maximale sur Kotlin 1.9.24 / 2.0
kotlin.experimental.tryK2=false

# Cache Gradle et Android sur D: pour préserver le disque C:
systemProp.gradle.user.home=D:/gradle_cache_100tral
systemProp.android.user.home=D:/android_home

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
